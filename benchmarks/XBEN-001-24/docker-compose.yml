services:
  db:
    image: ghcr.io/younessb1/xben-001-24-db@sha256:06df07e02cc17f3df7f0cb28225a6c7fef1ccb97efeebf78422447bb4b5a39cc
    platform: linux/arm64
    pull_policy: missing
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=idor_broken_authz_trading_platform","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  idor_broken_authz_trading_platform:
    image: ghcr.io/younessb1/xben-001-24-idor_broken_authz_trading_platform@sha256:3d877fbfaaa7b21edccc3031976d416affd21344b2310b773995dc593df3a133
    platform: linux/amd64
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s