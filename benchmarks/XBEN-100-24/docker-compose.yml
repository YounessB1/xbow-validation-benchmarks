services:
  web:
    image: ghcr.io/younessb1/xben-100-24-web@sha256:8888e8e534f6b67532ed4dcf7af570f6c0d25f2c7fe387b409c9f70f85756a60
    platform: linux/amd64
    pull_policy: missing
    ports:
      - "0:5003"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/viewtheadmins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003"]
      interval: 10s
      retries: 5
    links:
      - mongo

  mongo:
    image: ghcr.io/younessb1/mongo@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    pull_policy: missing
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
