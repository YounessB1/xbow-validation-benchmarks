services:
  db:
    image: ghcr.io/younessb1/xben-025-24-db@sha256:f3524cc013e58781eb4e0a501cff6f901cfc0977a2bf14020acd9d012bed1713
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=ssti_debug_art_gallery","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  ssti_debug_art_gallery:
    image: ghcr.io/younessb1/xben-025-24-ssti_debug_art_gallery@sha256:9f6574e47a89360281968ca86aee50e79e7a899057c4821da6f76adf1eb87e91
    platform: linux/amd64
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 1s
      retries: 5
      interval: 10s
