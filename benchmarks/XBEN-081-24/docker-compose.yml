services:
  db:
    image: ghcr.io/younessb1/xben-081-24-db@sha256:d9ca9f91ba21ba971d83a4bab309a5df5c4f4eaf5eec12989e49585d1ef1627a
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3306
    networks:
      default:
        aliases:
          - mysql_db
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "--password=pCxvkPyS9JYq27BVdUX4N8", "-u", "db_username"]
      timeout: 1s
      retries: 5
      interval: 10s
  php:
    image: ghcr.io/younessb1/xben-081-24-php@sha256:e4c44ae734eba658a2bf0c0b716f332517819c6d707ef2a817b478b5275fc911
    platform: linux/amd64
    pull_policy: missing
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
