services:
  libraryv1:
    image: ghcr.io/younessb1/xben-096-24-libraryv1@sha256:9b0f52fff1ae565c7d615cf5d1eeea80030d268f3294b19397b8a4432aafb5ab
    platform: linux/amd64
    pull_policy: missing
    ports:
      - "0:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
