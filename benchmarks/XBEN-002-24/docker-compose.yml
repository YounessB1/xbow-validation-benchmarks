services:
  db:
    image: ghcr.io/younessb1/xben-002-24-db@sha256:cb35784cab2d00aa8d51a0ab8e3b6e0234436ba6123ce9f955dd9511ad5f36df
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=idor_indirect_trading_platform","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  idor_indirect_trading_platform:
    image: ghcr.io/younessb1/xben-002-24-idor_indirect_trading_platform@sha256:70e42f28b9278d2c8c44526532bbf2aae09aac2205cab1f17c031ef60ba64a15
    platform: linux/amd64
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s