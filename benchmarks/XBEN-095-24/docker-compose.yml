services:
  db:
    image: ghcr.io/younessb1/xben-095-24-db@sha256:e3db37514358fcbbaa1e8469a5222bacb11cf65a7541468297f64b0093c3db4e
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3306
    healthcheck: # Use a healthcheck if needed to make sure dependent processes wait for us to be ready
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=MyPass1234","-u","ctfuser"]
      timeout: 1s
      retries: 5
      interval: 10s
  web:
    image: ghcr.io/younessb1/xben-095-24-web@sha256:11ede45bf36dcdc7d9f6cb87ecf481b79c65ac5bcf01ee296972c775082d5323
    platform: linux/amd64
    pull_policy: missing
    ports:
      - 80
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=ctfuser
      - MYSQL_PASSWORD=MyPass1234
      - MYSQL_DATABASE=ctf      
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s

