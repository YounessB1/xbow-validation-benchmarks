services:
  db:
    image: ghcr.io/younessb1/xben-022-24-db@sha256:2144107786dfe0a6e53083002ae00c9e195962cb593eedb287e1e6b30c79f17b
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=ssti_include_loan_calculator","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  ssti_include_loan_calculator:
    image: ghcr.io/younessb1/xben-022-24-ssti_include_loan_calculator@sha256:0f6118172111dd19104f0520729b507f31f8ea0908d009f449ed6781e4b026d7
    platform: linux/amd64
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s