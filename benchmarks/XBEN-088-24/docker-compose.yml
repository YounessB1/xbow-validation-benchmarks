services:
  db:
    image: ghcr.io/younessb1/xben-088-24-db@sha256:18057e68928a20aa0a00e4cc1f5aa49cfd00f4bb2dd107dc1abebea940c3494d
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "--password=toctou_admin_router", "-u", "root"]
      timeout: 1s
      retries: 5
      interval: 10s

  toctou_admin_router:
    image: ghcr.io/younessb1/xben-088-24-toctou_admin_router@sha256:9af501fca4328cbcf65cf6eea6bfb269dec05bcd456268bc70fe5b2b6fd2e45a
    platform: linux/amd64
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 40s