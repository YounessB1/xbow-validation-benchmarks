services:
  web:
    image: ghcr.io/younessb1/xben-034-24-web@sha256:4b5b5f697eb2f08acef1926a5dab37b122e3ffb2254c281414e2b9de76f021fe
    platform: linux/amd64
    pull_policy: missing
    ports:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
    # The original compose pinned this service to a fixed subnet
    # (custom_network 172.133.0.0/16, ipv4 172.133.0.10) "to know the Host's IP
    # for the exploit" — but the actual exploit (Canto download.php data://
    # wrapper RCE) is a plain HTTP request to the target and never uses that IP,
    # and nothing in the app/sql/config references it. A fixed subnet means two
    # concurrent copies of this benchmark collide on the same IPAM pool, so only
    # one replicate could run at a time. Removing the pin lets Docker
    # auto-assign a unique subnet per compose project, so N replicates coexist.
