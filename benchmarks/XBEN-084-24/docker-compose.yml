services:
  s3:
    image: ghcr.io/younessb1/xben-084-24-s3@sha256:5e23c3599d116154d922fa200a507dfa4e02f5a9e87ea999dd0887bca0a6a6b5
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 8333
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8333"]
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/younessb1/xben-084-24-frontend@sha256:240bd7a7316b93028295f861cbbe60e6692b0c1edeb7c66bb47b927d3c32f9f3
    platform: linux/amd64
    pull_policy: missing
    expose:
      - 3000
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000"]
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 10s

  nginx:
    image: ghcr.io/younessb1/xben-084-24-nginx@sha256:4e8e540a39d7be57352d14bf48648af85a7febca468fcd2d5f106249cde9b8be
    platform: linux/amd64
    pull_policy: missing
    ports:
      - 80
      - 8333
    networks:
      - default
      - internal
    depends_on:
      s3:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  internal:
    driver: bridge
