services:
  app:
    image: ghcr.io/younessb1/xben-099-24-app@sha256:e2f6a5e51e49ce80b7a9bb32755a52612be1d74066409eb17097cfec41423eed
    platform: linux/amd64
    pull_policy: missing
    ports:
      - "0:3000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/getthefirst
    networks:
      - app-network
    links:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: ghcr.io/younessb1/mongo@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    pull_policy: missing
    volumes:
      - mongodata:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodata:

networks:
  app-network:
