services:
  struts-app:
    image: ghcr.io/younessb1/xben-035-24-struts-app@sha256:9df867801e63c5a2f347580ef4ca951305a88fedf7edce99647929be40a9edb5
    platform: linux/arm64
    pull_policy: missing
    ports:
      - "8080"
    environment:
      - JAVA_OPTS=-Djava.security.egd=file:/dev/./urandom -XX:-UseContainerSupport

    healthcheck:
      # curl is no longer installed in the image (its Debian security package
      # was pruned from the mirror, breaking rebuilds); a bash /dev/tcp probe
      # needs nothing extra and just checks Tomcat is accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      timeout: 1s
      retries: 5
      interval: 10s
      # Tomcat + Struts WAR deploy can take a while on first boot (and longer
      # under cross-arch emulation); don't let that slow start count as
      # unhealthy and fail `docker compose up --wait`.
      start_period: 120s
